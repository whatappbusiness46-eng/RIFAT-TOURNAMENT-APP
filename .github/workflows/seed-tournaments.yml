
name: Seed ZYROX ARENA tournaments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyrox-database-maintenance
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Validate database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Check tournament seeder
        run: node --check server/seed-tournaments.js

      - name: Create tournament matches
        run: npm run seed:tournaments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require

      - name: Seeding completed
        run: echo "Tournament seeding workflow completed."
        
