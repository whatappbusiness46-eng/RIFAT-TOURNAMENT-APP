
name: Reset ZYROX ARENA Database

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: "Set true to permanently reset the database"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zyrox-database-maintenance
  cancel-in-progress: false

jobs:
  reset:
    name: Full Database Reset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check reset confirmation
        env:
          CONFIRM_INPUT: ${{ inputs.confirm_reset }}
        run: |
          if [ "$CONFIRM_INPUT" != "true" ] && [ "$CONFIRM_INPUT" != "TRUE" ] && [ "$CONFIRM_INPUT" != "YES" ]; then
            echo "::error::Reset cancelled. Set confirm_reset to true."
            exit 1
          fi

          echo "Reset confirmation accepted."

      - name: Validate GitHub Secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$ADMIN_EMAIL" ]; then
            echo "::error::ADMIN_EMAIL secret is missing."
            exit 1
          fi

          if [ ${#ADMIN_PASSWORD} -lt 12 ]; then
            echo "::error::ADMIN_PASSWORD must be at least 12 characters."
            exit 1
          fi

          echo "Required secrets are available."

      - name: Check JavaScript syntax
        run: |
          node --check server/db.js
          node --check server/reset-database.js

      - name: Run Full Database Reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          PGSSLMODE: require
          CONFIRM_ZYROX_FULL_RESET: YES
        run: node server/reset-database.js

      - name: Final Verification
        run: |
          echo "ZYROX ARENA database reset workflow completed."
          
