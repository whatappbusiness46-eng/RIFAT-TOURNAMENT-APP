
name: Seed ZYROX ARENA tournaments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyrox-database-maintenance
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Validate database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Check seeder syntax
        run: node --check server/seed-tournaments.js

      - name: Seed 200 tournaments
        run: npm run seed:tournaments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require

      - name: Complete
        run: echo "ZYROX ARENA tournament seeding completed."
        
