name: Render health check

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-health-check
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request Render health endpoint
        env:
          HEALTH_URL: https://rifat-tournament-app.onrender.com/api/health
        run: |
          echo "Checking Render health endpoint..."
          curl --fail --show-error --silent \
            --connect-timeout 15 \
            --max-time 45 \
            "$HEALTH_URL"
          echo
          echo "Health endpoint responded successfully."
          
